<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Solid neon-cyan backdrop with dark border to match your website theme -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#00f0ff" stroke="#0b0f19" stroke-width="2"/>
  
  <!-- Clear, solid dark lettering centered inside the block -->
  <text x="32" y="40" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" 
        font-size="17" 
        font-weight="900" 
        fill="#0b0f19" 
        text-anchor="middle"
        letter-spacing="-1.2">
    &lt;K.G.&gt;
  </text>
</svg>
