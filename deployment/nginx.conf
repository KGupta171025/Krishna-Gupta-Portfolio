# Hardened Nginx Reverse Proxy Configuration Template

# Rate Limit definition: max 5 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name krishnagupta.dev www.krishnagupta.dev;
    
    # Redirect all insecure HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name krishnagupta.dev www.krishnagupta.dev;

    # SSL / TLS Protocols Hardening (Only allow TLS 1.2 and TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Replace with path to your Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/krishnagupta.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krishnagupta.dev/privkey.pem;

    # Security Headers Configuration
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; connect-src 'self' https://disify.com https://api.emailjs.com;" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Disable Nginx version token exposure
    server_tokens off;

    # Prevent large payload DoS/buffer overflow attacks
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 2 1k;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Apply API request rate limiting
        limit_req zone=api_limit burst=10 nodelay;
    }
}
